<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" role="img" aria-labelledby="title desc">
  <title id="title">Положение точки относительно выпуклого многоугольника</title>
  <desc id="desc">Выпуклый пятиугольник A 1,1, B 7,1, C 9,4, D 6,7, E 2,6. Точка Q 5,4 находится внутри, R 4,1 лежит на границе, T 9,7 находится снаружи.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="edgeArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/>
    </marker>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .plot{fill:#fafafa;stroke:#9ca3af;stroke-width:1.2}
      .grid{stroke:#d1d5db;stroke-width:1}
      .axis{stroke:#111827;stroke-width:2.4}
      .polygon{fill:#3b82f6;fill-opacity:0.12;stroke:#1d4ed8;stroke-width:3.5;stroke-linejoin:round}
      .direction{fill:none;stroke:#1d4ed8;stroke-width:3;stroke-linecap:round}
      .pointVertex{fill:#2563eb;stroke:#ffffff;stroke-width:2}
      .pointIn{fill:#16a34a;stroke:#ffffff;stroke-width:2}
      .pointBoundary{fill:#1d4ed8;stroke:#ffffff;stroke-width:2}
      .pointOut{fill:#dc2626;stroke:#ffffff;stroke-width:2}
      .guide{stroke:#dc2626;stroke-width:1.8;stroke-dasharray:7 7;opacity:0.6}
      .tick{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#4b5563}
      .axisName{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-style:italic;fill:#111827}
      .heading{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#111827}
      .subheading{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#4b5563}
      .vertex{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-style:italic;fill:#111827;stroke:#ffffff;stroke-width:7;paint-order:stroke fill;stroke-linejoin:round}
      .pointLabel{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700}
      .cardTitle{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700}
      .formula{font-family:Georgia,'Times New Roman',serif;font-size:23px;fill:#111827}
      .note{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#374151}
    </style>
  </defs>
  <rect width="1680" height="900" fill="#ffffff"/>
  <text class="heading" x="555" y="48" text-anchor="middle">Точка относительно выпуклого многоугольника</text>
  <text class="subheading" x="555" y="79" text-anchor="middle">Проверяем знаки cross(Pᵢ, Pᵢ₊₁, X) для всех направленных рёбер</text>
  <rect class="plot" x="120" y="130" width="900" height="640"/>
  <g aria-label="Координатная сетка">
    <path class="grid" d="M120 130V770 M200 130V770 M280 130V770 M360 130V770 M440 130V770 M520 130V770 M600 130V770 M680 130V770 M760 130V770 M840 130V770 M920 130V770 M1000 130V770"/>
    <path class="grid" d="M120 130H1020 M120 210H1020 M120 290H1020 M120 370H1020 M120 450H1020 M120 530H1020 M120 610H1020 M120 690H1020 M120 770H1020"/>
  </g>
  <g aria-label="Оси координат">
    <line class="axis" x1="80" y1="770" x2="1060" y2="770" marker-end="url(#axisArrow)"/>
    <line class="axis" x1="120" y1="810" x2="120" y2="95" marker-end="url(#axisArrow)"/>
    <text class="axisName" x="1074" y="780">x</text>
    <text class="axisName" x="107" y="85">y</text>
  </g>
  <g aria-label="Подписи оси X">
    <text class="tick" x="120" y="800" text-anchor="middle">0</text>
    <text class="tick" x="200" y="800" text-anchor="middle">1</text>
    <text class="tick" x="280" y="800" text-anchor="middle">2</text>
    <text class="tick" x="360" y="800" text-anchor="middle">3</text>
    <text class="tick" x="440" y="800" text-anchor="middle">4</text>
    <text class="tick" x="520" y="800" text-anchor="middle">5</text>
    <text class="tick" x="600" y="800" text-anchor="middle">6</text>
    <text class="tick" x="680" y="800" text-anchor="middle">7</text>
    <text class="tick" x="760" y="800" text-anchor="middle">8</text>
    <text class="tick" x="840" y="800" text-anchor="middle">9</text>
    <text class="tick" x="920" y="800" text-anchor="middle">10</text>
    <text class="tick" x="1000" y="800" text-anchor="middle">11</text>
  </g>
  <g aria-label="Подписи оси Y">
    <text class="tick" x="103" y="776" text-anchor="end">0</text>
    <text class="tick" x="103" y="696" text-anchor="end">1</text>
    <text class="tick" x="103" y="616" text-anchor="end">2</text>
    <text class="tick" x="103" y="536" text-anchor="end">3</text>
    <text class="tick" x="103" y="456" text-anchor="end">4</text>
    <text class="tick" x="103" y="376" text-anchor="end">5</text>
    <text class="tick" x="103" y="296" text-anchor="end">6</text>
    <text class="tick" x="103" y="216" text-anchor="end">7</text>
    <text class="tick" x="103" y="136" text-anchor="end">8</text>
  </g>
  <g aria-label="Выпуклый пятиугольник ABCDE">
    <path class="polygon" d="M200 690 L680 690 L840 450 L600 210 L280 290 Z"/>
  </g>
  <g aria-label="Направление обхода против часовой стрелки">
    <line class="direction" x1="350" y1="690" x2="490" y2="690" marker-end="url(#edgeArrow)"/>
    <line class="direction" x1="728" y1="618" x2="777" y2="544.5" marker-end="url(#edgeArrow)"/>
    <line class="direction" x1="775" y1="385" x2="697" y2="307" marker-end="url(#edgeArrow)"/>
    <line class="direction" x1="493" y1="236.75" x2="402" y2="259.5" marker-end="url(#edgeArrow)"/>
    <line class="direction" x1="253.33" y1="423.33" x2="226.67" y2="530" marker-end="url(#edgeArrow)"/>
  </g>
  <g aria-label="Направляющие к внешней точке T">
    <line class="guide" x1="840" y1="210" x2="840" y2="770"/>
    <line class="guide" x1="120" y1="210" x2="840" y2="210"/>
  </g>
  <g aria-label="Вершины многоугольника">
    <circle class="pointVertex" cx="200" cy="690" r="10" filter="url(#shadow)"/>
    <circle class="pointVertex" cx="680" cy="690" r="10" filter="url(#shadow)"/>
    <circle class="pointVertex" cx="840" cy="450" r="10" filter="url(#shadow)"/>
    <circle class="pointVertex" cx="600" cy="210" r="10" filter="url(#shadow)"/>
    <circle class="pointVertex" cx="280" cy="290" r="10" filter="url(#shadow)"/>
    <text class="vertex" x="160" y="726">A(1, 1)</text>
    <text class="vertex" x="695" y="725">B(7, 1)</text>
    <text class="vertex" x="855" y="444">C(9, 4)</text>
    <text class="vertex" x="615" y="196">D(6, 7)</text>
    <text class="vertex" x="207" y="274">E(2, 6)</text>
  </g>
  <g aria-label="Точка Q внутри многоугольника">
    <circle class="pointIn" cx="520" cy="450" r="11" filter="url(#shadow)"/>
    <rect x="537" y="398" width="224" height="77" rx="11" fill="#ffffff" fill-opacity="0.94" stroke="#86efac" stroke-width="1.5"/>
    <text class="pointLabel" x="551" y="429" fill="#15803d">Q(5, 4)</text>
    <text x="551" y="458" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#15803d">внутри</text>
  </g>
  <g aria-label="Точка R на границе многоугольника">
    <circle class="pointBoundary" cx="440" cy="690" r="11" filter="url(#shadow)"/>
    <rect x="347" y="713" width="228" height="52" rx="10" fill="#ffffff" fill-opacity="0.94" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="pointLabel" x="361" y="744" fill="#1d4ed8">R(4, 1) — граница</text>
  </g>
  <g aria-label="Точка T снаружи многоугольника">
    <circle class="pointOut" cx="840" cy="210" r="11" filter="url(#shadow)"/>
    <rect x="857" y="154" width="171" height="74" rx="11" fill="#ffffff" fill-opacity="0.94" stroke="#fca5a5" stroke-width="1.5"/>
    <text class="pointLabel" x="871" y="184" fill="#dc2626">T(9, 7)</text>
    <text x="871" y="213" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#dc2626">снаружи</text>
  </g>
  <line x1="1100" y1="35" x2="1100" y2="865" stroke="#d1d5db" stroke-width="2"/>
  <g aria-label="Результаты проверки знаков">
    <text class="heading" x="1380" y="48" text-anchor="middle">Знаки произведений</text>
    <text class="subheading" x="1380" y="79" text-anchor="middle">cross(AB, X), cross(BC, X), …, cross(EA, X)</text>
    <rect x="1140" y="120" width="530" height="168" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="1173" cy="156" r="10" fill="#16a34a"/>
    <text class="cardTitle" x="1195" y="164" fill="#15803d">Q(5, 4): INSIDE</text>
    <text class="formula" x="1170" y="210">18, 12, 12, 11, 17</text>
    <text class="note" x="1170" y="250">Все значения положительны.</text>
    <text class="note" x="1170" y="274">Точка строго внутри многоугольника.</text>
    <rect x="1140" y="320" width="530" height="168" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="1173" cy="356" r="10" fill="#2563eb"/>
    <text class="cardTitle" x="1195" y="364" fill="#1d4ed8">R(4, 1): BOUNDARY</text>
    <text class="formula" x="1170" y="410">0, 18, 15, 19, 30</text>
    <text class="note" x="1170" y="450">Знаки не смешиваются, но есть ноль.</text>
    <text class="note" x="1170" y="474">Точка лежит на ребре AB.</text>
    <rect x="1140" y="520" width="530" height="168" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <circle cx="1173" cy="556" r="10" fill="#dc2626"/>
    <text class="cardTitle" x="1195" y="564" fill="#dc2626">T(9, 7): OUTSIDE</text>
    <text class="formula" x="1170" y="610">36, 6, −9, 4, 51</text>
    <text class="note" x="1170" y="650">Есть положительные и отрицательные значения.</text>
    <text class="note" x="1170" y="674">Точка находится снаружи.</text>
    <rect x="1140" y="730" width="530" height="105" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <text class="note" x="1170" y="769">Для выпуклого многоугольника одинаковый знак</text>
    <text class="note" x="1170" y="797">всех ненулевых произведений означает принадлежность.</text>
  </g>
</svg>