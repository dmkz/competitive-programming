<text class="math" x="215" y="143" fill="#1557e8">b</text>
<text class="num" x="712" y="270">x</text>
<text class="num" x="125" y="38">y</text>
</g>
<text class="formula" x="750" y="770">Площадь = |a × b| = 6</text>
</svg>