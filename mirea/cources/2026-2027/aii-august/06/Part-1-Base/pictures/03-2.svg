.title{font:bold 34px Arial,sans-serif;fill:#111;text-anchor:middle}
.sub{font:bold 21px Arial,sans-serif;fill:#111;text-anchor:middle}
.math{font:italic 28px "Times New Roman",serif}
.num{font:18px Arial,sans-serif;fill:#111}
.formula{font:bold 27px Arial,sans-serif;fill:#111;text-anchor:middle}
</style>
</defs>
<rect width="1400" height="930" fill="white"/>
<text class="title" x="700" y="48">ВЕКТОРНОЕ ПРОИЗВЕДЕНИЕ</text>
<text class="sub" x="700" y="82">ЗНАК ОПРЕДЕЛЯЕТ НАПРАВЛЕНИЕ ПОВОРОТА, МОДУЛЬ — ПЛОЩАДЬ</text>
<line x1="40" y1="108" x2="1360" y2="108" stroke="#888"/>
<g transform="translate(55 145)">
