</g>
<path class="axis" d="M50 250H375" marker-end="url(#blackArrow)"/>
<path class="axis" d="M50 270V25" marker-end="url(#blackArrow)"/>
<path class="vecA" d="M50 250H300" marker-end="url(#redArrow)"/>
<path class="vecB" d="M50 250L250 100" marker-end="url(#blueArrow)"/>
