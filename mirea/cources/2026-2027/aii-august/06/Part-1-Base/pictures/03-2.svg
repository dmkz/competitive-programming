</g>
<path class="axis" d="M50 250H375" marker-end="url(#blackArrow)"/>
<path class="axis" d="M50 270V25" marker-end="url(#blackArrow)"/>
<path class="vecA" d="M200 250H310" marker-end="url(#redArrow)"/>
<path class="vecB" d="M200 250H75" marker-end="url(#blueArrow)"/>
<text class="math" x="315" y="237" fill="#e21b16">a</text>
