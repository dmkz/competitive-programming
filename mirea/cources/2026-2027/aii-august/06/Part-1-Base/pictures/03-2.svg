<g class="grid">
<path d="M0 250H700M0 200H700M0 150H700M0 100H700M0 50H700M50 50V250M100 50V250M150 50V250M200 50V250M250 50V250M300 50V250M350 50V250M400 50V250M450 50V250M500 50V250M550 50V250M600 50V250M650 50V250M700 50V250"/>
</g>
<path class="axis" d="M0 250H730" marker-end="url(#blackArrow)"/>
<path class="axis" d="M150 270V25" marker-end="url(#blackArrow)"/>
