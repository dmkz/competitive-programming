<svg viewBox="0 0 1100 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Точка с максимальной высотой может иметь меньший угол, чем более низкая точка, закрывающая обзор">
<defs>
<marker id="smallBlueArrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
</marker>
<marker id="smallRedArrow" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
</marker>
</defs>
<rect width="1100" height="650" fill="white"/>
<text x="550" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827">Высота вершины и угол направления — разные критерии</text>
<polyline points="40,260 100,100 200,350 300,215 410,420 520,310 650,510 780,440 930,570"
fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="100" y1="100" x2="780" y2="440" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="11 8" marker-end="url(#smallRedArrow)"/>
<line x1="100" y1="100" x2="300" y2="215" stroke="#2563eb" stroke-width="3.5" marker-end="url(#smallBlueArrow)"/>
<line x1="300" y1="215" x2="965" y2="215" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 7"/>
<g fill="#334155">
<circle cx="40" cy="260" r="6"/>
<circle cx="200" cy="350" r="6"/>
<circle cx="410" cy="420" r="6"/>
<circle cx="650" cy="510" r="6"/>
<circle cx="930" cy="570" r="6"/>
</g>
<circle cx="100" cy="100" r="9" fill="#111827"/>
<circle cx="300" cy="215" r="8" fill="#2563eb"/>
<circle cx="520" cy="310" r="8" fill="#dc2626"/>
<circle cx="780" cy="440" r="8" fill="#7c3aed"/>
<circle cx="520" cy="310" r="15" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<g font-family="Arial, sans-serif" font-size="19" font-weight="bold">
<text x="61" y="82" fill="#111827">пик 0</text>
<text x="263" y="198" fill="#2563eb">пик 1</text>
<text x="535" y="301" fill="#dc2626">пик 2</text>
<text x="794" y="432" fill="#7c3aed">пик 3</text>
</g>
<text x="60" y="126" font-family="Arial, sans-serif" font-size="16" fill="#475569">наблюдатель</text>
<path d="M157 100 A57 57 0 0 1 149.5 128.4" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<path d="M174 100 A74 74 0 0 1 166.2 133.1" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<text x="119" y="161" font-family="Arial, sans-serif" font-size="16" fill="#2563eb">угол к пику 1</text>
<text x="183" y="133" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626">угол к пикам 2 и 3 больше</text>
<rect x="700" y="102" width="330" height="91" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="724" cy="130" r="6" fill="#2563eb"/>
<text x="741" y="136" font-family="Arial, sans-serif" font-size="17" fill="#111827">пик 1 выше пиков 2 и 3</text>
<text x="724" y="169" font-family="Arial, sans-serif" font-size="16" fill="#475569">но луч к пику 3 проходит над ним</text>
<line x1="520" y1="290" x2="596" y2="226" stroke="#dc2626" stroke-width="1.5"/>
<rect x="590" y="194" width="380" height="74" rx="10" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="780" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#b91c1c">Пик 2 лежит на отрезке к пику 3</text>
<text x="780" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">касание склона закрывает обзор</text>
<line x1="300" y1="215" x2="300" y2="174" stroke="#2563eb" stroke-width="1.5"/>
<text x="300" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">максимальная высота</text>
<rect x="105" y="535" width="860" height="76" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="535" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">Если убрать пик 2, пунктирный отрезок нигде не касается склона,</text>
<text x="535" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#7c3aed">поэтому пик 3 будет виден из пика 0</text>
</svg>