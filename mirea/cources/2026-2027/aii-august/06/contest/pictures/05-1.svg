<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Самая высокая вершина не обязательно задаёт максимальный угол обзора">
<rect width="1200" height="800" fill="white"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#111827">Высота вершины и угол направления — разные критерии</text>
<line x1="120" y1="190" x2="1040" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 7"/>
<text x="820" y="176" font-family="Arial, sans-serif" font-size="16" fill="#64748b">горизонтальное направление</text>
<polyline points="35,355 120,190 220,455 330,310 450,535 600,430 725,605 840,550 990,690"
fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="120" y1="190" x2="840" y2="550" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="11 8"/>
<line x1="120" y1="190" x2="330" y2="310" stroke="#2563eb" stroke-width="3.5"/>
<path d="M195 190 A75 75 0 0 1 187.08 223.54" fill="none" stroke="#dc2626" stroke-width="3"/>
<path d="M170 190 A50 50 0 0 1 163.41 214.81" fill="none" stroke="#2563eb" stroke-width="3"/>
<line x1="187" y1="218" x2="265" y2="148" stroke="#dc2626" stroke-width="1.5"/>
<rect x="250" y="100" width="270" height="55" rx="9" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="385" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c">угол к пикам 2 и 3</text>
<text x="385" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#b91c1c">больше</text>
<line x1="163" y1="211" x2="205" y2="251" stroke="#2563eb" stroke-width="1.5"/>
<rect x="175" y="247" width="190" height="46" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="270" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">угол к пику 1</text>
<g fill="#334155">
<circle cx="35" cy="355" r="6"/>
<circle cx="220" cy="455" r="6"/>
<circle cx="450" cy="535" r="6"/>
<circle cx="725" cy="605" r="6"/>
<circle cx="990" cy="690" r="6"/>
</g>
<circle cx="120" cy="190" r="10" fill="#111827"/>
<circle cx="330" cy="310" r="9" fill="#2563eb"/>
<circle cx="600" cy="430" r="9" fill="#dc2626"/>
<circle cx="840" cy="550" r="9" fill="#7c3aed"/>
<circle cx="600" cy="430" r="17" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<g font-family="Arial, sans-serif" font-size="20" font-weight="bold">
<text x="79" y="168" fill="#111827">пик 0</text>
<text x="344" y="304" fill="#2563eb">пик 1</text>
<text x="619" y="419" fill="#dc2626">пик 2</text>
<text x="858" y="542" fill="#7c3aed">пик 3</text>
</g>
<rect x="25" y="205" width="130" height="44" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="90" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">наблюдатель</text>
<line x1="120" y1="205" x2="120" y2="199" stroke="#64748b" stroke-width="1.5"/>
<line x1="330" y1="329" x2="330" y2="350" stroke="#2563eb" stroke-width="1.5"/>
<rect x="225" y="348" width="210" height="47" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="330" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">максимальная высота</text>
<line x1="610" y1="413" x2="665" y2="365" stroke="#dc2626" stroke-width="1.5"/>
<rect x="650" y="287" width="360" height="82" rx="10" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="830" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#b91c1c">Пик 2 лежит на отрезке к пику 3</text>
<text x="830" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">касание склона закрывает обзор</text>
<rect x="1015" y="245" width="170" height="140" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="1038" cy="273" r="6" fill="#2563eb"/>
<text x="1054" y="279" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">Пик 1 выше</text>
<text x="1032" y="307" font-family="Arial, sans-serif" font-size="16" fill="#111827">пиков 2 и 3,</text>
<text x="1032" y="334" font-family="Arial, sans-serif" font-size="16" fill="#111827">но красный луч</text>
<text x="1032" y="361" font-family="Arial, sans-serif" font-size="16" fill="#111827">проходит над ним</text>
<line x1="840" y1="568" x2="840" y2="592" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="775" y="590" width="400" height="78" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="975" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">Если убрать пик 2, отрезок к пику 3</text>
<text x="975" y="647" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7c3aed">не касается склона: пик 3 будет виден</text>
<rect x="65" y="710" width="1070" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="100" cy="735" r="7" fill="#2563eb"/>
<text x="122" y="741" font-family="Arial, sans-serif" font-size="16" fill="#111827">Пик 1 самый высокий, но задаёт более низкое направление и не закрывает пик 3.</text>
<circle cx="100" cy="763" r="7" fill="#dc2626"/>
<text x="122" y="769" font-family="Arial, sans-serif" font-size="16" fill="#111827">Пик 2 ниже, но имеет больший угол и лежит на отрезке к пику 3, поэтому закрывает его.</text>
</svg>