<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Самая высокая промежуточная вершина не обязательно задаёт максимальный угол обзора">
<defs>
<marker id="arrowBluePeak" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
</marker>
<marker id="arrowRedPeak" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
</marker>
</defs>
<rect width="1100" height="620" fill="white"/>
<text x="550" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827">Высота вершины и угол направления — разные критерии</text>
<line x1="120" y1="100" x2="820" y2="100" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 7"/>
<text x="830" y="106" font-family="Arial, sans-serif" font-size="17" fill="#64748b">уровень исходного пика</text>
<line x1="120" y1="100" x2="760" y2="420" stroke="#dc2626" stroke-width="4" stroke-dasharray="11 8" marker-end="url(#arrowRedPeak)"/>
<line x1="120" y1="100" x2="300" y2="215" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBluePeak)"/>
<line x1="300" y1="215" x2="945" y2="215" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="784" y="203" font-family="Arial, sans-serif" font-size="17" fill="#2563eb">пик 1 выше пиков 2 и 3</text>
<polyline points="45,235 120,100 210,335 300,215 405,405 500,290 625,500 760,420 875,540"
fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="45" cy="235" r="6" fill="#334155"/>
<circle cx="120" cy="100" r="11" fill="#111827"/>
<circle cx="210" cy="335" r="6" fill="#334155"/>
<circle cx="300" cy="215" r="10" fill="#2563eb"/>
<circle cx="405" cy="405" r="6" fill="#334155"/>
<circle cx="500" cy="290" r="12" fill="#dc2626"/>
<circle cx="625" cy="500" r="6" fill="#334155"/>
<circle cx="760" cy="420" r="10" fill="#7c3aed"/>
<circle cx="875" cy="540" r="6" fill="#334155"/>
<circle cx="500" cy="290" r="19" fill="none" stroke="#dc2626" stroke-width="3"/>
<path d="M495 273 L505 307 M483 290 L517 290" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
<path d="M195 100 A75 75 0 0 1 183.2 140.4" fill="none" stroke="#dc2626" stroke-width="3"/>
<path d="M180 100 A60 60 0 0 1 170.5 132.3" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="175" y="166" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#dc2626">больший угол</text>
<g font-family="Arial, sans-serif" font-size="21" font-weight="bold">
<text x="91" y="87" fill="#111827">пик 0</text>
<text x="273" y="198" fill="#2563eb">пик 1</text>
<text x="514" y="278" fill="#dc2626">пик 2</text>
<text x="774" y="414" fill="#7c3aed">пик 3</text>
</g>
<text x="89" y="126" font-family="Arial, sans-serif" font-size="17" fill="#111827">наблюдатель</text>
<line x1="520" y1="260" x2="579" y2="205" stroke="#dc2626" stroke-width="1.8"/>
<rect x="575" y="154" width="285" height="74" rx="9" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="717.5" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#b91c1c">Пик 2 лежит на луче к пику 3</text>
<text x="717.5" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">касание закрывает обзор</text>
<rect x="70" y="555" width="960" height="48" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="104" cy="579" r="6" fill="#2563eb"/>
<text x="121" y="585" font-family="Arial, sans-serif" font-size="17" fill="#111827">пик 1 имеет максимальную высоту, но не закрывает луч к пику 3</text>
<circle cx="599" cy="579" r="6" fill="#dc2626"/>
<text x="616" y="585" font-family="Arial, sans-serif" font-size="17" fill="#111827">пик 2 имеет больший угол и закрывает пик 3</text>
<text x="550" y="529" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7c3aed">Если убрать пик 2, пунктирный отрезок не касается склона, и пик 3 будет виден</text>
</svg>