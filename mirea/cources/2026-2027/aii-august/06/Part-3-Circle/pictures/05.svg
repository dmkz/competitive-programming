<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" role="img" aria-labelledby="title desc">
  <title id="title">Возможные положения прямой относительно окружности</title>
  <desc id="desc">Три случая взаимного расположения прямой и окружности: секущая с двумя общими точками, касательная с одной общей точкой и прямая без пересечений.</desc>
  <defs>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .circle{fill:#2563eb;fill-opacity:0.035;stroke:#111827;stroke-width:3}
      .line{stroke:#1d4ed8;stroke-width:4;stroke-linecap:round}
      .radius{stroke:#111827;stroke-width:2.5;stroke-linecap:round}
      .distance{stroke:#6b7280;stroke-width:2.5;stroke-dasharray:9 8}
      .rightAngle{fill:none;stroke:#374151;stroke-width:2}
      .point{fill:#111827;stroke:#ffffff;stroke-width:1.5}
      .separator{stroke:#d1d5db;stroke-width:2}
      .math{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-style:italic;fill:#111827}
      .pointName{font-family:Georgia,'Times New Roman',serif;font-size:30px;font-style:italic;fill:#111827}
      .heading{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#111827}
      .condition{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-style:italic;fill:#1d4ed8}
      .result{font-family:Arial,Helvetica,sans-serif;font-size:25px;fill:#374151}
      .count{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#ffffff}
    </style>
  </defs>
  <rect width="1680" height="900" fill="#ffffff"/>
  <line class="separator" x1="560" y1="35" x2="560" y2="865"/>
  <line class="separator" x1="1120" y1="35" x2="1120" y2="865"/>
  <g aria-label="Секущая, две общие точки">
    <circle class="circle" cx="280" cy="315" r="190"/>
    <line class="line" x1="30" y1="455" x2="530" y2="455"/>
    <line class="distance" x1="280" y1="315" x2="280" y2="455"/>
    <line class="radius" x1="280" y1="315" x2="408.452" y2="455"/>
    <path class="rightAngle" d="M280 437H298V455"/>
    <circle class="point" cx="280" cy="315" r="8" filter="url(#shadow)"/>
    <circle class="point" cx="280" cy="455" r="8" filter="url(#shadow)"/>
    <circle class="point" cx="151.548" cy="455" r="8" filter="url(#shadow)"/>
    <circle class="point" cx="408.452" cy="455" r="8" filter="url(#shadow)"/>
    <text class="pointName" x="253" y="292">O</text>
    <text class="pointName" x="266" y="493">H</text>
    <text class="math" x="250" y="393" text-anchor="end">d</text>
    <text class="math" x="352" y="378">R</text>
    <g aria-label="Общие точки">
      <circle cx="151.548" cy="455" r="16" fill="none" stroke="#1d4ed8" stroke-width="2" opacity="0.35"/>
      <circle cx="408.452" cy="455" r="16" fill="none" stroke="#1d4ed8" stroke-width="2" opacity="0.35"/>
    </g>
    <text class="heading" x="280" y="615" text-anchor="middle">Секущая</text>
    <text class="condition" x="280" y="675" text-anchor="middle">d &lt; R</text>
    <g transform="translate(160 720)">
      <rect width="240" height="54" rx="27" fill="#1d4ed8"/>
      <circle cx="34" cy="27" r="17" fill="#ffffff" fill-opacity="0.2"/>
      <text class="count" x="34" y="35" text-anchor="middle">2</text>
      <text x="66" y="35" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#ffffff">общие точки</text>
    </g>
    <text class="result" x="280" y="825" text-anchor="middle">Прямая проходит через круг</text>
  </g>
  <g aria-label="Касательная, одна общая точка">
    <circle class="circle" cx="840" cy="315" r="190"/>
    <line class="line" x1="590" y1="125" x2="1090" y2="125"/>
    <line class="distance" x1="840" y1="125" x2="840" y2="315"/>
    <line class="radius" x1="840" y1="315" x2="974.35" y2="449.35"/>
    <path class="rightAngle" d="M840 143H858V125"/>
    <circle class="point" cx="840" cy="125" r="8" filter="url(#shadow)"/>
    <circle class="point" cx="840" cy="315" r="8" filter="url(#shadow)"/>
    <text class="pointName" x="826" y="104">H</text>
    <text class="pointName" x="799" y="337">O</text>
    <text class="math" x="857" y="230">d</text>
    <text class="math" x="916" y="389">R</text>
    <circle cx="840" cy="125" r="17" fill="none" stroke="#1d4ed8" stroke-width="2" opacity="0.35"/>
    <text class="heading" x="840" y="615" text-anchor="middle">Касательная</text>
    <text class="condition" x="840" y="675" text-anchor="middle">d = R</text>
    <g transform="translate(720 720)">
      <rect width="240" height="54" rx="27" fill="#1d4ed8"/>
      <circle cx="34" cy="27" r="17" fill="#ffffff" fill-opacity="0.2"/>
      <text class="count" x="34" y="35" text-anchor="middle">1</text>
      <text x="66" y="35" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#ffffff">общая точка</text>
    </g>
    <text class="result" x="840" y="825" text-anchor="middle">Расстояние равно радиусу</text>
  </g>
  <g aria-label="Пересечений нет">
    <circle class="circle" cx="1400" cy="365" r="190"/>
    <line class="line" x1="1150" y1="90" x2="1650" y2="90"/>
    <line class="distance" x1="1400" y1="90" x2="1400" y2="365"/>
    <line class="radius" x1="1400" y1="365" x2="1534.35" y2="499.35"/>
    <path class="rightAngle" d="M1400 108H1418V90"/>
    <circle class="point" cx="1400" cy="90" r="8" filter="url(#shadow)"/>
    <circle class="point" cx="1400" cy="365" r="8" filter="url(#shadow)"/>
    <text class="pointName" x="1386" y="69">H</text>
    <text class="pointName" x="1359" y="388">O</text>
    <text class="math" x="1417" y="231">d</text>
    <text class="math" x="1478" y="441">R</text>
    <text class="heading" x="1400" y="615" text-anchor="middle">Нет пересечения</text>
    <text class="condition" x="1400" y="675" text-anchor="middle">d &gt; R</text>
    <g transform="translate(1280 720)">
      <rect width="240" height="54" rx="27" fill="#64748b"/>
      <circle cx="34" cy="27" r="17" fill="#ffffff" fill-opacity="0.2"/>
      <text class="count" x="34" y="35" text-anchor="middle">0</text>
      <text x="66" y="35" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#ffffff">общих точек</text>
    </g>
    <text class="result" x="1400" y="825" text-anchor="middle">Прямая проходит снаружи</text>
  </g>
</svg>