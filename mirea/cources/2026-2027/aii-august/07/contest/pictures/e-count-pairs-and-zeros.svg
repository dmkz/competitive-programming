<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: #172033;
    }
    .title {
      font-size: 31px;
      font-weight: 700;
      text-anchor: middle;
    }
    .subtitle {
      font-size: 19px;
      fill: #475569;
      text-anchor: middle;
    }
    .section {
      font-size: 22px;
      font-weight: 700;
      text-anchor: middle;
    }
    .value {
      font-size: 22px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .core {
      font-size: 17px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .bucket-title {
      font-size: 19px;
      font-weight: 700;
      text-anchor: middle;
    }
    .bucket-text {
      font-size: 17px;
      text-anchor: middle;
    }
    .formula {
      font-size: 20px;
      font-weight: 700;
      text-anchor: middle;
    }
    .note {
      font-size: 17px;
      fill: #475569;
      text-anchor: middle;
    }
    .index {
      font-size: 15px;
      fill: #64748b;
      text-anchor: middle;
    }
  </style>
  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="600" y="45" class="title">
    Подсчёт пар по одинаковым квадратно-свободным частям
  </text>
  <text x="600" y="77" class="subtitle">
    Массив просматривается слева направо, поэтому каждая пара учитывается один раз
  </text>

  <text x="600" y="122" class="section">Обработанные элементы</text>

  <g>
    <rect x="70" y="150" width="130" height="100" rx="14"
          fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="135" y="184" class="value">12</text>
    <text x="135" y="222" class="core">core = 3</text>
    <text x="135" y="272" class="index">индекс 0</text>

    <rect x="225" y="150" width="130" height="100" rx="14"
          fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="290" y="184" class="value">18</text>
    <text x="290" y="222" class="core">core = 2</text>
    <text x="290" y="272" class="index">индекс 1</text>

    <rect x="380" y="150" width="130" height="100" rx="14"
          fill="#f3f4f6" stroke="#64748b" stroke-width="2"/>
    <text x="445" y="184" class="value">0</text>
    <text x="445" y="222" class="core">ноль</text>
    <text x="445" y="272" class="index">индекс 2</text>

    <rect x="535" y="150" width="130" height="100" rx="14"
          fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="600" y="184" class="value">−75</text>
    <text x="600" y="222" class="core">core = 3</text>
    <text x="600" y="272" class="index">индекс 3</text>

    <rect x="690" y="150" width="130" height="100" rx="14"
          fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
    <text x="755" y="184" class="value">147</text>
    <text x="755" y="222" class="core">core = 3</text>
    <text x="755" y="272" class="index">текущий, i = 4</text>
  </g>

  <path d="M135 290 L135 324 Q135 340 153 340 L350 340"
        fill="none" stroke="#7c3aed" stroke-width="3"
        marker-end="url(#arrow-purple)"/>
  <path d="M600 290 L600 324 Q600 340 582 340 L410 340"
        fill="none" stroke="#7c3aed" stroke-width="3"
        marker-end="url(#arrow-purple)"/>
  <path d="M755 290 L755 324 Q755 340 737 340 L470 340"
        fill="none" stroke="#7c3aed" stroke-width="3"
        marker-end="url(#arrow-purple)"/>

  <rect x="260" y="360" width="400" height="116" rx="16"
        fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="460" y="397" class="bucket-title" fill="#6d28d9">
    Группа с core = 3
  </text>
  <text x="460" y="430" class="bucket-text">
    ранее встречены 12 и −75
  </text>
  <text x="460" y="458" class="bucket-text">
    cnt[3] = 2
  </text>

  <rect x="715" y="360" width="415" height="116" rx="16"
        fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="922" y="397" class="bucket-title" fill="#c2410c">
    Текущий ненулевой элемент
  </text>
  <text x="922" y="430" class="bucket-text">
    образует 2 пары с той же характеристикой
  </text>
  <text x="922" y="458" class="bucket-text">
    и 1 пару с предыдущим нулём
  </text>

  <line x1="675" y1="418" x2="700" y2="418"
        stroke="#7c3aed" stroke-width="3"
        marker-end="url(#arrow-purple)"/>

  <rect x="70" y="520" width="500" height="112" rx="16"
        fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="320" y="557" class="bucket-title" fill="#166534">
    Ненулевой текущий элемент
  </text>
  <text x="320" y="592" class="formula">
    новых пар = cnt[core] + nZeros
  </text>
  <text x="320" y="617" class="note">
    В примере: 2 + 1 = 3
  </text>

  <rect x="630" y="520" width="500" height="112" rx="16"
        fill="#f3f4f6" stroke="#64748b" stroke-width="2"/>
  <text x="880" y="557" class="bucket-title">
    Текущий элемент равен нулю
  </text>
  <text x="880" y="592" class="formula">
    новых пар = i
  </text>
  <text x="880" y="617" class="note">
    Ноль подходит ко всем предыдущим элементам
  </text>

  <rect x="110" y="674" width="980" height="72" rx="15"
        fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="705" class="formula">
    Пара учитывается при обработке своего правого конца
  </text>
  <text x="600" y="731" class="note">
    Поэтому условие i &lt; j выполняется автоматически и двойного подсчёта нет.
  </text>
</svg>