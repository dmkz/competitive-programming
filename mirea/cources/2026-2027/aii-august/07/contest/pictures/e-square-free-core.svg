<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: #172033;
    }
    .title {
      font-size: 31px;
      font-weight: 700;
      text-anchor: middle;
    }
    .subtitle {
      font-size: 20px;
      fill: #475569;
      text-anchor: middle;
    }
    .number {
      font-size: 27px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .factor {
      font-size: 22px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .factor-note {
      font-size: 16px;
      text-anchor: middle;
      fill: #475569;
    }
    .core {
      font-size: 24px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .arrow-note {
      font-size: 16px;
      font-weight: 700;
      text-anchor: middle;
    }
    .conclusion {
      font-size: 23px;
      font-weight: 700;
      text-anchor: middle;
    }
    .formula {
      font-size: 22px;
      text-anchor: middle;
    }
    .note {
      font-size: 18px;
      text-anchor: middle;
      fill: #475569;
    }
  </style>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="46" class="title">
    Квадратно-свободная часть числа
  </text>
  <text x="600" y="78" class="subtitle">
    Оставляем только простые множители, входящие в нечётной степени
  </text>

  <rect x="55" y="125" width="1090" height="190" rx="18"
        fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="85" y="170" width="125" height="82" rx="14"
        fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="147" y="212" class="number">12</text>

  <line x1="225" y1="211" x2="300" y2="211"
        stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="262" y="190" class="arrow-note" fill="#1d4ed8">разложение</text>

  <rect x="320" y="150" width="160" height="122" rx="14"
        fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="192" class="factor">2²</text>
  <text x="400" y="230" class="factor-note">степень чётная</text>

  <text x="505" y="212" class="factor">×</text>

  <rect x="535" y="150" width="160" height="122" rx="14"
        fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="615" y="192" class="factor">3¹</text>
  <text x="615" y="230" class="factor-note">степень нечётная</text>

  <line x1="715" y1="211" x2="805" y2="211"
        stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="760" y="190" class="arrow-note" fill="#15803d">оставляем</text>

  <rect x="825" y="163" width="275" height="96" rx="15"
        fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="962" y="212" class="core">core(12) = 3</text>

  <rect x="55" y="340" width="1090" height="190" rx="18"
        fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="85" y="385" width="125" height="82" rx="14"
        fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="147" y="427" class="number">75</text>

  <line x1="225" y1="426" x2="300" y2="426"
        stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="262" y="405" class="arrow-note" fill="#1d4ed8">разложение</text>

  <rect x="320" y="365" width="160" height="122" rx="14"
        fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="407" class="factor">3¹</text>
  <text x="400" y="445" class="factor-note">степень нечётная</text>

  <text x="505" y="427" class="factor">×</text>

  <rect x="535" y="365" width="160" height="122" rx="14"
        fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="615" y="407" class="factor">5²</text>
  <text x="615" y="445" class="factor-note">степень чётная</text>


  <line x1="715" y1="426" x2="805" y2="426"
        stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="760" y="405" class="arrow-note" fill="#15803d">оставляем</text>

  <rect x="825" y="378" width="275" height="96" rx="15"
        fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text x="962" y="427" class="core">core(75) = 3</text>

  <path d="M962 266 L962 300 Q962 320 940 320 L650 320"
        fill="none" stroke="#16a34a" stroke-width="4"/>
  <path d="M962 481 L962 550 Q962 570 940 570 L650 570"
        fill="none" stroke="#16a34a" stroke-width="4"/>
  <line x1="650" y1="320" x2="650" y2="550"
        stroke="#16a34a" stroke-width="4"/>
  <line x1="650" y1="550" x2="600" y2="550"
        stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)"/>

  <rect x="105" y="555" width="990" height="145" rx="18"
        fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
  <text x="600" y="595" class="conclusion" fill="#166534">
    Квадратно-свободные части совпадают
  </text>
  <text x="600" y="638" class="formula">
    12 × 75 = (2² × 3) × (3 × 5²) = 2² × 3² × 5² = 30²
  </text>
  <text x="600" y="676" class="note">
    Поэтому произведение является подлым квадратом.
  </text>

  <rect x="70" y="716" width="1060" height="32" rx="10"
        fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="738" class="note">
    Красным отмечены множители с чётными степенями: они не входят в характеристику числа.
  </text>
</svg>