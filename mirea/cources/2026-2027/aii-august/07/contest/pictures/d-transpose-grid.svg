    <line x1="800" y1="230" x2="1000" y2="230"/>
    <line x1="800" y1="310" x2="1000" y2="310"/>
    <line x1="800" y1="390" x2="1000" y2="390"/>
    <line x1="800" y1="470" x2="1000" y2="470"/>
