    <text x="850" y="190">a₀,₀</text>
    <text x="950" y="190">a₁,₀</text>
    <text x="850" y="270">a₀,₁</text>
    <text x="950" y="270">a₁,₁</text>
    <text x="850" y="350">a₀,₂</text>
    <text x="950" y="350">a₁,₂</text>
    <text x="850" y="430">a₀,₃</text>
