<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: Arial, sans-serif;
      fill: #172033;
    }
    .title {
      font-size: 30px;
      font-weight: 700;
      text-anchor: middle;
    }
    .subtitle {
      font-size: 21px;
      font-weight: 700;
      text-anchor: middle;
    }
    .cell-text {
      font-size: 18px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .side-label {
      font-size: 17px;
      fill: #475569;
      text-anchor: middle;
    }
    .point-label {
      font-size: 16px;
      font-weight: 700;
      text-anchor: middle;
    }
    .formula {
