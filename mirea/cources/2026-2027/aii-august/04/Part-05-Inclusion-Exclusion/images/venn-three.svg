<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="title description">
  <title id="title">Диаграмма Венна для трёх множеств</title>
  <desc id="description">Три пересекающихся круга, обозначенные A, B и C.</desc>
  <circle cx="270" cy="150" r="105" fill="#48a9e6" fill-opacity="0.55" stroke="#176b9e" stroke-width="4"/>
  <circle cx="370" cy="150" r="105" fill="#f6ad55" fill-opacity="0.55" stroke="#b85c00" stroke-width="4"/>
  <circle cx="320" cy="235" r="105" fill="#6fcf97" fill-opacity="0.55" stroke="#287a4d" stroke-width="4"/>
  <text x="220" y="118" fill="#17324d" font-family="sans-serif" font-size="30" text-anchor="middle">A</text>
  <text x="420" y="118" fill="#5c3100" font-family="sans-serif" font-size="30" text-anchor="middle">B</text>
  <text x="320" y="305" fill="#164b30" font-family="sans-serif" font-size="30" text-anchor="middle">C</text>
  <text x="320" y="202" fill="#202020" font-family="sans-serif" font-size="22" text-anchor="middle">A ∩ B ∩ C</text>
</svg>