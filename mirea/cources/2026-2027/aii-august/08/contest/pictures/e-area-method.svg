  <text x="770" y="470" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">B</text>
  <text x="495" y="96" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">C</text>
