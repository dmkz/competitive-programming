<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect x="2" y="2" width="996" height="556" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">
    <tspan x="500" dy="0">Точность проверки площадей и точность бинарного поиска —</tspan>
    <tspan x="500" dy="32">разные вещи</tspan>
  </text>
  <rect x="75" y="102" width="850" height="125" rx="15" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="105" y="134" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#991b1b">
    Сравнение без допуска
  </text>
  <text x="105" y="170" font-family="monospace" font-size="17" fill="#334155">
    s1 = 1000000000000.0000001
  </text>
  <text x="550" y="170" font-family="monospace" font-size="17" fill="#334155">
    s2 = 1000000000000.0000000
  </text>
  <text x="500" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#b91c1c">
    s1 == s2 → false, хотя математически площади равны
  </text>
  <rect x="75" y="248" width="850" height="125" rx="15" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="105" y="280" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">
    Сравнение с относительным и абсолютным допуском
  </text>
  <text x="500" y="319" text-anchor="middle" font-family="monospace" font-size="18" fill="#334155">
    |s1 - s2| ≤ eps · max(1, |s1|, |s2|)
  </text>
  <text x="500" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d">
    Значения считаются равными с учётом ошибки вычислений
  </text>
  <line x1="125" y1="420" x2="875" y2="420" stroke="#64748b" stroke-width="3"/>
  <line x1="310" y1="402" x2="310" y2="438" stroke="#2563eb" stroke-width="5"/>
  <line x1="690" y1="402" x2="690" y2="438" stroke="#f59e0b" stroke-width="5"/>
  <rect x="105" y="451" width="410" height="51" rx="11" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="310" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">
    <tspan x="310" dy="0">EPS площадей:</tspan>
    <tspan x="310" dy="21">корректность check(t)</tspan>
  </text>
  <rect x="535" y="451" width="360" height="51" rx="11" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
  <text x="715" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b45309">
    <tspan x="715" dy="0">Точность поиска:</tspan>
    <tspan x="715" dy="21">близость low и high</tspan>
  </text>
  <text x="500" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">
    Один допуск не заменяет другой
  </text>
</svg>